name: Public framework
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify public source (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: windows-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_publication.py --all-refs
      - run: python -m pip install -e ".[dev,bt]"
      - run: python -B scripts/verify_public_research.py
      - run: python -m pytest tests -q
      - run: python -m build
      - run: python scripts/check_publication.py --artifacts dist
      - name: Build explicitly public website
        run: python scripts/build_site.py --output .runtime/site --revision ${{ github.sha }} --zip dist/quantfactra-demo.zip
      - run: python scripts/check_publication.py --artifacts dist
      - uses: actions/upload-artifact@v4
        with:
          name: public-framework-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
