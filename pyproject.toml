[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfactra"
version = "0.2.0"
description = "Multi-agent research workflows with replaceable models and execution adapters"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "pandas>=2.1,<3", "requests>=2.31,<3", "psutil>=5.9,<8"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
bt = ["bt==1.4.1", "ffn==1.4.1", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<9", "build>=1.2"]

[project.scripts]
quantfactra = "quantfactra.cli:main"
quant-research = "quantfactra.cli:main"

[project.urls]
Homepage = "https://yanxxzz.github.io/quantfactra/"
Repository = "https://github.com/Yanxxzz/quantfactra"

[tool.setuptools.packages.find]
include = ["quantfactra*", "panda_alpha*", "quant_research*"]

[tool.setuptools.package-data]
quantfactra = ["templates/*.py", "templates/*.json", "templates/*.md", "templates/*.toml", "cases/*/*.json", "cases/*/*.md"]
"panda_alpha.team" = ["roles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
